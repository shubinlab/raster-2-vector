name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y libpotrace0 libcairo2
      - run: python -m pip install -e .
      - run: raster-2-vector doctor
      - run: python -m unittest discover -s tests -v
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: brew install potrace cairo
      - name: Expose Homebrew Cairo to the Python framework loader
        run: echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix cairo)/lib" >> "$GITHUB_ENV"
      - run: python -m pip install -e .
      - run: raster-2-vector doctor
      - run: python -m unittest discover -s tests -v
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax, skill metadata and installer (not vector engine)
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -p test_distribution.py -v
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t raster-2-vector:ci .
      - run: docker run --rm raster-2-vector:ci doctor

  skills-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate that the standard skills installer discovers this repository
        run: npx --yes skills add . --list
